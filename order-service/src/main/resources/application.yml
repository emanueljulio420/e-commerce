spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

catalog-service:
  url: ${CATALOG_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET:cambiaEstaClaveSecretaPorUnaMuchoMasLargaYSeguraEnProduccion123456}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}