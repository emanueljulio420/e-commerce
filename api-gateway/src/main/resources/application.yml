spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8083
              predicates:
                - Path=/api/auth/**
            - id: catalog-service
              uri: http://catalog-service:8081
              predicates:
                - Path=/api/catalog/**
            - id: order-service
              uri: http://order-service:8082
              predicates:
                - Path=/api/order/**
server:
  port: 8080